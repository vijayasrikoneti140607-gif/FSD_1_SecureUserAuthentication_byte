<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SecureAuth</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="card"><div class="logo">🔐 SecureAuth</div><h1>Create account</h1><p>Join SecureAuth</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button>Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></main></body></html>
