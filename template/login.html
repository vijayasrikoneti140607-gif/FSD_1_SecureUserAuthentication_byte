<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | SecureAuth</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="card"><div class="logo">🔐 SecureAuth</div><h1>Welcome back</h1><p>Sign in to your account</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Login</button></form><p>New here? <a href="{{ url_for('register') }}">Create account</a></p></main></body></html>
